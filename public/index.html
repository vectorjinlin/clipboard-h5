<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>947剪贴板</title>
  <meta name="application-name" content="947剪贴板">
  <meta name="apple-mobile-web-app-title" content="947剪贴板">
  <link rel="manifest" href="/manifest.webmanifest?v=20260612-4">
  <link rel="icon" href="/icon.png?v=20260612-4" type="image/png">
  <link rel="shortcut icon" href="/favicon.ico?v=20260612-4">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260612-4">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "tnum";
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    html,
    body {
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      min-height: 100svh;
    }

    .code-cell-valid {
      border-color: #4f8f64 !important;
      background: #f4fbf5 !important;
      box-shadow: 0 0 0 3px rgba(79, 143, 100, 0.14);
    }

    .decrypted-card {
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      transition: opacity 420ms ease, transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .decrypted-card.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .stats-modal {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .stats-modal.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

  </style>
</head>
<body class="bg-[radial-gradient(circle_at_20%_10%,#fffaf0_0,#f5f1e8_34%,#ece5d7_100%)] text-[#181714] antialiased">
  <main class="mx-auto flex min-h-[100svh] min-h-[100dvh] w-full max-w-[560px] flex-col px-5 pb-[calc(env(safe-area-inset-bottom)+16px)] pt-[calc(env(safe-area-inset-top)+16px)] sm:px-8">
    <header class="flex min-w-0 items-center justify-between gap-3">
      <h1 class="min-w-0 truncate text-xl font-semibold tracking-normal text-[#181714]">947剪贴板</h1>
      <button id="home-help-button" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-[#d4cab9] bg-white/45 text-[#181714] transition hover:bg-white/70" type="button" aria-label="添加到桌面" title="添加到桌面">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="7" y="2.75" width="10" height="18.5" rx="2.25" stroke="currentColor" stroke-width="2"/>
          <path d="M10.5 18h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <section id="home-help" class="fixed left-4 right-4 top-[calc(env(safe-area-inset-top)+58px)] z-50 mx-auto hidden max-w-[528px] grid gap-3 rounded-md border border-[#d4cab9] bg-stone-50 px-3 py-3 text-sm text-stone-700 shadow-[0_18px_45px_rgba(49,37,20,0.14)]">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="font-medium text-stone-900">添加到手机桌面</p>
          <p class="mt-1 text-xs text-stone-600">像应用一样打开，减少浏览器地址栏占用。</p>
        </div>
        <button id="home-help-close" class="h-7 shrink-0 rounded-md px-2 text-sm font-medium text-stone-700 hover:bg-stone-100" type="button">关闭</button>
      </div>
      <div class="grid gap-2 sm:grid-cols-2">
        <div class="rounded-md border border-stone-200 bg-white/70 p-3">
          <p class="font-medium text-stone-900">Chrome Android / 桌面</p>
          <p class="mt-1 text-stone-600">右上角 ⋮ → 添加到主屏幕</p>
        </div>
        <div class="rounded-md border border-stone-200 bg-white/70 p-3">
          <p class="font-medium text-stone-900">Safari iPhone / iPad</p>
          <p class="mt-1 text-stone-600">底栏分享 → 添加到主屏幕</p>
        </div>
      </div>
    </section>

    <section id="send-view" class="flex flex-1 flex-col justify-start pt-12 sm:pt-16">
      <div class="mb-6">
        <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl">发送到任意设备</h1>
      </div>

      <input id="clip-input" class="min-h-[56px] w-full rounded-2xl border border-[#d4cab9] bg-white/72 px-5 py-3.5 text-center text-xl font-semibold leading-7 shadow-[0_22px_60px_rgba(49,37,20,0.10)] outline-none transition focus:border-[#181714]" type="text" placeholder="输入文本内容" autocomplete="off">

      <button id="send-button" class="mt-4 min-h-[56px] w-full rounded-2xl bg-[#181714] px-5 py-3.5 text-lg font-extrabold text-[#f5f1e8] shadow-[0_22px_60px_rgba(49,37,20,0.10)] transition disabled:cursor-not-allowed disabled:opacity-35 active:scale-[0.99]" type="button" disabled>发送</button>

      <section id="send-result" class="mt-7 hidden scroll-mt-6 rounded-[28px] border border-white/70 bg-[#f7f3ea]/90 p-5 shadow-[0_22px_60px_rgba(49,37,20,0.10)]" aria-live="polite">
        <strong id="share-code" class="mx-auto block w-fit max-w-full cursor-pointer select-none whitespace-nowrap rounded-2xl bg-white/55 px-5 py-3 text-center text-4xl font-extrabold tracking-[0.16em] text-[#181714] sm:text-5xl" role="button" tabindex="0" aria-label="复制接收链接">------</strong>

        <div class="my-5 flex items-center gap-3 text-sm font-semibold text-[#847b6c]">
          <span class="h-px flex-1 bg-[#d4cab9]"></span>
          <span id="countdown" class="min-w-fit"></span>
          <span class="h-px flex-1 bg-[#d4cab9]"></span>
        </div>

        <div class="grid place-items-center gap-3">
          <img id="qr-image" class="h-[220px] w-[220px] rounded-2xl bg-white p-2" alt="接收链接二维码">
          <p class="text-center text-sm font-semibold text-[#847b6c]">用另一台设备扫码打开</p>
        </div>
      </section>

      <div class="mt-8 flex justify-center">
        <button id="manual-entry-button" class="text-sm font-semibold text-[#847b6c] underline decoration-[#d4cab9] underline-offset-4" type="button">切换到接收</button>
      </div>
    </section>

    <section id="receive-view" class="hidden flex flex-1 flex-col justify-start pt-12 sm:pt-16">
      <div class="rounded-[34px] border border-white/70 bg-[#f7f3ea]/95 p-5 text-center shadow-[0_22px_60px_rgba(49,37,20,0.10)] sm:p-6">
        <div id="decrypted-card" class="decrypted-card hidden rounded-[28px] border border-[#d4cab9]/70 bg-[linear-gradient(145deg,rgba(255,255,255,0.82),rgba(239,232,218,0.66))] px-5 py-6 shadow-inner">
          <div id="decrypted-text" class="max-h-[34vh] overflow-auto whitespace-pre-wrap break-words text-center text-2xl font-semibold leading-9 text-[#181714]"></div>
        </div>

        <button id="copy-button" class="mt-5 min-h-[60px] w-full rounded-[24px] bg-[#181714] px-5 py-4 text-xl font-extrabold text-[#f5f1e8] shadow-[0_22px_60px_rgba(49,37,20,0.10)] transition disabled:cursor-not-allowed disabled:opacity-35 active:scale-[0.99]" type="button" disabled>复制</button>
        <p id="receive-state" class="mt-3 min-h-6 text-sm font-medium text-[#847b6c]">正在本地解密</p>
      </div>

      <div class="mt-8 flex justify-center gap-5 text-sm font-semibold text-[#847b6c]">
        <button id="receive-to-send-button" class="underline decoration-[#d4cab9] underline-offset-4" type="button">切换到发送</button>
        <button id="receive-manual-button" class="underline decoration-[#d4cab9] underline-offset-4" type="button">切换到接收</button>
      </div>
    </section>

    <section id="manual-view" class="hidden flex flex-1 flex-col justify-start pt-12 sm:pt-16">
      <div class="mb-6">
        <h1 class="text-4xl font-extrabold tracking-tight">接收加密文本</h1>
      </div>

      <div class="grid grid-cols-6 gap-2 sm:gap-3">
        <input class="code-cell h-16 rounded-2xl border border-[#d4cab9] bg-white/62 text-center text-3xl font-extrabold uppercase outline-none transition focus:border-[#181714]" maxlength="1" autocomplete="off" inputmode="text">
        <input class="code-cell h-16 rounded-2xl border border-[#d4cab9] bg-white/62 text-center text-3xl font-extrabold uppercase outline-none transition focus:border-[#181714]" maxlength="1" autocomplete="off" inputmode="text">
        <input class="code-cell h-16 rounded-2xl border border-[#d4cab9] bg-white/62 text-center text-3xl font-extrabold uppercase outline-none transition focus:border-[#181714]" maxlength="1" autocomplete="off" inputmode="text">
        <input class="code-cell h-16 rounded-2xl border border-[#d4cab9] bg-white/62 text-center text-3xl font-extrabold uppercase outline-none transition focus:border-[#181714]" maxlength="1" autocomplete="off" inputmode="text">
        <input class="code-cell h-16 rounded-2xl border border-[#d4cab9] bg-white/62 text-center text-3xl font-extrabold uppercase outline-none transition focus:border-[#181714]" maxlength="1" autocomplete="off" inputmode="text">
        <input class="code-cell h-16 rounded-2xl border border-[#d4cab9] bg-white/62 text-center text-3xl font-extrabold uppercase outline-none transition focus:border-[#181714]" maxlength="1" autocomplete="off" inputmode="text">
      </div>

      <button id="decrypt-button" class="mt-6 w-full rounded-2xl bg-[#181714] px-5 py-4 text-lg font-extrabold text-[#f5f1e8] shadow-[0_22px_60px_rgba(49,37,20,0.10)] transition disabled:cursor-not-allowed disabled:opacity-35 active:scale-[0.99]" type="button" disabled>解密文本</button>
      <p id="manual-state" class="mt-4 min-h-6 text-center text-sm font-semibold text-[#847b6c]">请输入六位接收码</p>

      <div class="mt-8 flex justify-center">
        <button id="manual-to-send-button" class="text-sm font-semibold text-[#847b6c] underline decoration-[#d4cab9] underline-offset-4" type="button">切换到发送</button>
      </div>
    </section>

    <footer id="app-footer" class="pb-1 pt-6 text-center text-[11px] font-medium leading-5 text-[#847b6c]/50">
      <p>本地加密 · 跨设备传输 · 自动销毁</p>
      <p>Developed by @1u1uguru  | Version 0.3.4</p>
    </footer>
  </main>

  <div id="stats-modal" class="stats-modal fixed inset-0 z-[60] grid place-items-end bg-[#181714]/20 px-4 pb-[calc(env(safe-area-inset-bottom)+16px)] pt-8 backdrop-blur-sm sm:place-items-center">
    <section class="w-full max-w-[520px] rounded-[28px] border border-white/70 bg-[#f7f3ea] p-5 shadow-[0_24px_80px_rgba(49,37,20,0.22)]">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 class="text-xl font-extrabold text-[#181714]">最近访问</h2>
          <p id="stats-summary" class="mt-1 text-sm font-semibold text-[#847b6c]">正在读取</p>
        </div>
        <button id="stats-close" class="rounded-full border border-[#d4cab9] px-3 py-1 text-sm font-bold text-[#181714]" type="button">关闭</button>
      </div>
      <div id="stats-list" class="mt-4 grid max-h-[48vh] gap-2 overflow-auto"></div>
      <div class="mt-4 flex items-center justify-between gap-3">
        <button id="stats-prev" class="rounded-full border border-[#d4cab9] px-4 py-2 text-sm font-bold text-[#181714] disabled:cursor-not-allowed disabled:opacity-35" type="button">上一页</button>
        <p id="stats-page" class="text-xs font-semibold text-[#847b6c]">1 / 1</p>
        <button id="stats-next" class="rounded-full border border-[#d4cab9] px-4 py-2 text-sm font-bold text-[#181714] disabled:cursor-not-allowed disabled:opacity-35" type="button">下一页</button>
      </div>
    </section>
  </div>

  <script src="/app.js?v=0.3.4"></script>
</body>
</html>
