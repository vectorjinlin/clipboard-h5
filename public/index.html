<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>60秒剪贴板</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="top-switch">
      <button id="mode-send" class="top-tab active" type="button">发送</button>
      <button id="mode-receive" class="top-tab" type="button">接收</button>
    </section>

    <section class="send-view">
      <label class="block-label" for="clip-input">文本内容</label>
      <textarea id="clip-input" class="text-box" placeholder="长按粘贴文本"></textarea>

      <label class="toggle-line">
        <input id="mask-toggle" type="checkbox">
        <span>隐藏文本</span>
      </label>

      <button id="send-button" class="main-button" type="button">生成接收码</button>

      <section id="send-result" class="result-card hidden" aria-live="polite">
        <div class="code-wrap">
          <strong id="share-code">------</strong>
          <p id="countdown" class="status-text"></p>
        </div>

        <div class="qr-divider">
          <span>或扫码接收</span>
        </div>

        <div class="qr-panel">
          <img id="qr-image" alt="接收码二维码">
          <p class="qr-caption">对方扫码后自动填入接收码</p>
        </div>
      </section>
    </section>

    <section class="receive-view hidden">
      <section class="sub-switch">
        <button id="manual-tab" class="sub-tab active" type="button">⌨ 手动输入</button>
        <button id="scan-tab" class="sub-tab" type="button">◱ 扫码识别</button>
      </section>

      <section id="manual-panel">
        <label class="block-label">输入 6 位接收码</label>
        <div class="code-grid">
          <input class="code-cell" maxlength="1" autocomplete="off">
          <input class="code-cell" maxlength="1" autocomplete="off">
          <input class="code-cell" maxlength="1" autocomplete="off">
          <input class="code-cell" maxlength="1" autocomplete="off">
          <input class="code-cell" maxlength="1" autocomplete="off">
          <input class="code-cell" maxlength="1" autocomplete="off">
        </div>
      </section>

      <section id="scan-panel" class="hidden">
        <div class="scan-box">
          <video id="scanner-video" playsinline muted></video>
          <div id="scanner-placeholder" class="scan-placeholder">点击“扫码识别”后调起摄像头</div>
        </div>
      </section>

      <button id="receive-button" class="main-button" type="button">解密并复制</button>

      <div id="receive-state" class="receive-state">
        <p class="status-text">输入完整接收码后，点击解密并复制。</p>
      </div>

      <section id="receive-result" class="result-card hidden">
        <pre id="received-text"></pre>
      </section>
    </section>

    <footer class="footer">
      <h1>60秒剪贴板</h1>
      <p>一次性加密 · 跨设备传输 · 60 秒自动销毁</p>
      <p>v0.2.1 · @11u1uguru</p>
    </footer>
  </main>

  <script src="/app.js?v=0.2.1"></script>
</body>
</html>
